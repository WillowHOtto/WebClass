<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blood Supply Checker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f7f9;

</head>

<body>

    <header>
        <h1>Hospital Blood Supply</h1>
        <p>Check the current availability of donated blood</p>
    </header>

    <main class="container">

        <div class="card">

            <h2>Blood Supply Checker</h2>

            <p class="card-description">
                Select a blood type below to see how many units are currently available.
            </p>

            <div class="form-group">

                <label for="blood-group-abo">
                    ABO Blood Group
                </label>

                <select id="blood-group-abo">
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="AB">AB</option>
                    <option value="O">O</option>
                </select>

            </div>

            <div class="form-group">

                <label for="blood-group-rh">
                    Rh Factor
                </label>

                <select id="blood-group-rh">
                    <option value="positive">Positive (+)</option>
                    <option value="negative">Negative (-)</option>
                </select>

            </div>

            <button id="get-blood-units-button">
                Check Blood Availability
            </button>

            <div class="result">

                <h3>Blood Supply Result</h3>

                <p>
                    Blood Group:
                    <span id="blood-group-display">--</span>
                </p>

                <p>
                    Units Available:
                    <span id="units-available">--</span>
                </p>

            </div>

        </div>

    </main>

    <footer>
        Hospital Blood Supply System
    </footer>


    <script>

        // Get the ABO blood group selected by the user
        let bloodGroupAboInput =
            document.querySelector('#blood-group-abo');

        // Get the Rh factor selected by the user
        let bloodGroupRhInput =
            document.querySelector('#blood-group-rh');

        // Get the button
        let getBloodUnitsButton =
            document.querySelector('#get-blood-units-button');

        // Get the elements where we will display the results
        let bloodGroupDisplay =
            document.querySelector('#blood-group-display');

        let unitsAvailableDisplay =
            document.querySelector('#units-available');


        // Run this code when the user clicks the button
        getBloodUnitsButton.addEventListener('click', function () {

            // Get the selected ABO blood group
            let abo = bloodGroupAboInput.value;

            // Get the selected Rh factor
            let rh = bloodGroupRhInput.value;


            // Convert the Rh value into + or -
            let rhSymbol;

            if (rh === 'positive') {
                rhSymbol = '+';
            } else {
                rhSymbol = '-';
            }


            // Combine the ABO and Rh values
            // For example: A + positive = A+
            let bloodGroup = abo + rhSymbol;


            // Show the blood group the user selected
            bloodGroupDisplay.textContent = bloodGroup;

            // Display a temporary message while the API is loading
            unitsAvailableDisplay.textContent = 'Loading...';


            // Connect to the blood supply API
            fetch(
                `https://blood-group-api.wl.r.appspot.com/${bloodGroup}`
            )

                // Check the response from the API
                .then(function (response) {

                    if (!response.ok) {
                        throw new Error(
                            'Unable to retrieve blood supply'
                        );
                    }

                    return response.json();

                })


                // Process the API response
                .then(function (data) {

                    // Display the number of available units
                    unitsAvailableDisplay.textContent = data.units;

                })


                // Handle errors
                .catch(function (error) {

                    console.error(error);

                    unitsAvailableDisplay.textContent =
                        'Unable to retrieve blood supply';

                });

        });

    </script>

</body>
</html>
