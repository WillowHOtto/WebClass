<!DOCTYPE html>
<html lang="en">
<head>
    <title>Timeout</title>
</head>
    
<body>
    <h1>Expect an alert in 3 seconds after page loads</h1>


    <script>

        setTimeout(function() {
            alert('Hello! You waited 3 seconds to see this!')
        }, 3000) //3000 miliseconds = 3 seconds

    </script>


    
</body>
</html>
